<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivy Shelf</title>
<meta name="theme-color" content="#f6c9d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ivy Shelf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf6e9; --parchment:#f6e8cf; --parchment-deep:#ecd8b5;
  --ink:#5a3e2b; --ink-soft:#8a6a52; --ink-faint:#b89b80;
  --pink:#f6c9d3; --pink-deep:#e58ba2; --pink-pale:#fde8ed;
  --mint:#c3e8d3; --mint-deep:#7cc4a0; --mint-pale:#e6f6ec;
  --sky:#d6ecf6; --lav:#ddd0f0; --gold:#ecc66f; --peach:#f8d3b5;
  --wood:#a0714f; --wood-dark:#74503a;
  --shadow:rgba(90,62,43,.16);
  --pixel:'Press Start 2P', monospace;
  --serif:'EB Garamond', Georgia, serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
/* colour themes (bought with acorns) */
[data-theme=lavender]{--pink:#ddd0f0;--pink-deep:#a98bd6;--pink-pale:#f1eafb;--mint:#f6c9d3;--mint-deep:#e58ba2;--mint-pale:#fde8ed}
[data-theme=peach]{--pink:#f8d3b5;--pink-deep:#e2955f;--pink-pale:#fdeee2;--mint:#d5e4c3;--mint-deep:#94b77a;--mint-pale:#eef5e6}
[data-theme=forest]{--pink:#cfe3c0;--pink-deep:#6f9c5a;--pink-pale:#ecf4e4;--mint:#ecd9ae;--mint-deep:#b08a4f;--mint-pale:#f6eedd}
[data-theme=seaside]{--pink:#cfe6f2;--pink-deep:#5f9fc4;--pink-pale:#eaf5fa;--mint:#f3e1b8;--mint-deep:#d1a95c;--mint-pale:#fbf3e1}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;transition:background .6s}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
img{display:block}
a{color:var(--pink-deep)}
.pix{image-rendering:pixelated;display:block}

/* ---------- sky by time of day ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;transition:background 1s}
body[data-sky=morning] .sky{background:linear-gradient(180deg,#f9d4d0 0%,#fde6d6 32%,var(--cream) 62%)}
body[data-sky=day] .sky{background:linear-gradient(180deg,#d9eef8 0%,#eef6f3 30%,var(--cream) 62%)}
body[data-sky=sunset] .sky{background:linear-gradient(180deg,#f2a98f 0%,#f7cfa6 30%,#fbe6cc 52%,var(--cream) 70%)}
body[data-sky=night] .sky{background:linear-gradient(180deg,#1f2244 0%,#35335d 40%,#4f4570 100%)}
.cloud{position:absolute;width:120px;opacity:.9;animation:drift linear infinite}
body[data-sky=night] .cloud{opacity:.12!important}
body[data-sky=sunset] .cloud svg rect[fill="#ffffff"]{fill:#fde3d3}
.cloud svg{width:100%;height:auto}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
.starfield i{position:absolute;width:3px;height:3px;background:#fff6d8;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2}}
.weather{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.weather .p{position:absolute;top:-30px;width:14px;animation:fall linear infinite}
.weather .p svg{width:100%}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}25%{transform:translate(18px,25vh) rotate(90deg)}50%{transform:translate(-12px,50vh) rotate(180deg)}75%{transform:translate(16px,75vh) rotate(270deg)}100%{transform:translate(0,110vh) rotate(360deg)}}
.weather .fly{position:absolute;width:5px;height:5px;background:#fff3a1;box-shadow:0 0 8px 3px rgba(255,240,150,.7);animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(60px,-80px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.cloud,.weather,.companion{display:none}.starfield i{animation:none}}

/* night = natural dark mode for text that sits on the sky */
body[data-sky=night] main{color:#f6ecdc}
body[data-sky=night] main :is(.label,.muted,.note,.sub){color:#d6c6dc}
body[data-sky=night] main :is(.px,.inp,.chip,.seg button,.btn,.lockbox,.bubble,.result,.check-item,.typeswitch button){color:var(--ink)}
body[data-sky=night] main :is(.px,.lockbox,.bubble,.btn) :is(.label,.muted,.note,.sub){color:var(--ink-soft)}
body[data-sky=night] main .px .tile .sub{color:var(--ink-soft)}
body[data-sky=night] .link{color:#f6c9d3}

/* ---------- pixel boxes ---------- */
.px{background:var(--cream);margin:3px;
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 9px 0 var(--shadow)}
.card{padding:16px}
.pink{background:var(--pink-pale)} .mint{background:var(--mint-pale)} .parch{background:var(--parchment)}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:rgba(253,246,233,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid var(--ink)}
.topbar .brand{flex:1;min-width:0}
.brand-title{font-family:var(--serif);font-weight:600;font-style:italic;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--pixel);font-size:7px;letter-spacing:1px;color:var(--ink-soft);margin-top:4px}
.chip-stat{display:flex;align-items:center;gap:6px;font-family:var(--pixel);font-size:9px;background:var(--cream);color:var(--ink);padding:7px 8px;border:2px solid var(--ink);white-space:nowrap}
.chip-stat svg{width:14px;height:14px}
button.chip-stat{cursor:pointer}
main{padding:18px 16px calc(150px + var(--safe-b));max-width:1100px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--cream);border-top:3px solid var(--ink);padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;cursor:pointer;min-height:48px;color:var(--ink)}
.tabbar svg{width:24px;height:24px}
.tabbar span{font-family:var(--pixel);font-size:7px;color:var(--ink-soft)}
.tabbar button.on span{color:var(--ink)}
.tabbar button.on .tab-ico{background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.tab-ico{padding:3px 8px}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:31;width:56px;height:56px;border:0;cursor:pointer;
  background:var(--pink-deep);color:#fff;font-family:var(--pixel);font-size:22px;transition:transform .25s,opacity .25s;
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 8px 0 var(--shadow)}
.fab:active{transform:translateY(2px)}
.fab.hide{transform:translateY(140px);opacity:0;pointer-events:none}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:260px 1fr}
  .topbar,.tabbar{display:none}
  .fab{bottom:28px;right:28px}
  .sidebar{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;
    background:rgba(246,232,207,.92);border-right:3px solid var(--ink)}
  main{padding:30px 34px 120px;width:100%}
}
.side-brand{text-align:center;padding:6px 0 4px}
.side-brand .toad{width:84px;margin:0 auto 6px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.nav-cloud{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;cursor:pointer;padding:11px 14px;margin:3px 0;text-align:left;
  font-family:var(--pixel);font-size:9px;color:var(--ink);border-radius:999px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--shadow);transition:transform .15s}
.nav-cloud:hover{transform:translateX(3px)}
.nav-cloud.on{background:var(--pink)}
.nav-cloud svg{width:18px;height:18px;flex:none}
.side-level{padding:12px}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:32px;font-style:italic;line-height:1.1}
h2{font-size:23px;font-style:italic}
h3{font-size:19px}
.label{font-family:var(--pixel);font-size:8px;letter-spacing:.5px;color:var(--ink-soft);text-transform:uppercase}
.muted{color:var(--ink-soft)}
.small{font-size:15px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.section{margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:14px}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;font-family:var(--pixel);font-size:9px;line-height:1.3;padding:12px 14px;margin:3px;background:var(--cream);color:var(--ink);text-decoration:none;
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 6px 0 var(--shadow);min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--pink)}
.btn.mint{background:var(--mint)}
.btn.danger{background:#f3c1b5}
.btn.sm{font-size:8px;padding:8px 10px;min-height:32px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:14px;height:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--pixel);font-size:8px;color:var(--pink-deep);text-decoration:underline}

/* ---------- chips / tabs ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 10px;scrollbar-width:none;margin:0 -16px;padding-left:19px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{margin:0;padding-left:3px}}
.chip{flex:none;border:2px solid var(--ink);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:var(--pixel);font-size:8px;white-space:nowrap}
.chip.on{background:var(--pink)}
.chip .n{opacity:.6;margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--pixel);font-size:7px;padding:5px 7px;border:2px solid var(--ink);background:#fff;white-space:nowrap;color:var(--ink)}
.badge svg{width:10px;height:10px}
.b-want{background:var(--lav)} .b-active{background:var(--mint)} .b-finished{background:var(--gold)} .b-dnf{background:#e8d9cc}
.toggle2{display:inline-flex;border:2px solid var(--ink);background:#fff}
.toggle2 button{border:0;background:none;padding:8px 12px;font-family:var(--pixel);font-size:8px;cursor:pointer;color:var(--ink)}
.toggle2 button.on{background:var(--pink)}

/* ---------- forms ---------- */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-family:var(--pixel);font-size:8px;color:var(--ink-soft);margin:0 0 7px}
.inp{width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:11px 12px;border-radius:0;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{background:var(--pink-pale)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-row{display:flex;gap:8px}
.search-row .inp{flex:1}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dotted var(--ink-faint);cursor:pointer}
.switch:last-child{border:0}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:28px;border:2px solid var(--ink);background:#fff;position:relative;flex:none;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink-faint);transition:.15s}
.switch input:checked{background:var(--mint)}
.switch input:checked::after{left:27px;background:var(--ink)}

/* ---------- covers ---------- */
.cover{position:relative;aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--parchment-deep);
  box-shadow:0 0 0 3px var(--ink),0 7px 0 3px var(--shadow)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12% 10% 12% 18%;color:var(--ink)}
.cover-ph::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11%;background:rgba(90,62,43,.18);border-right:2px solid rgba(90,62,43,.35)}
.cover-ph::after{content:"";position:absolute;inset:7% 7% 7% 16%;border:2px solid rgba(90,62,43,.28);outline:1px solid rgba(255,255,255,.5);outline-offset:-5px}
.cover-ph .t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(12px,3.4vw,17px);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;word-break:break-word;position:relative}
.cover-ph .a{font-size:clamp(10px,2.6vw,13px);margin-top:6px;opacity:.75;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.cover-ph .orn{width:22%;margin-top:9%;position:relative}
.cover-ph.game{padding:26% 10% 10%}
.cover-ph.game::before{left:0;right:0;top:0;bottom:auto;width:auto;height:15%;background:rgba(90,62,43,.78);border:0}
.cover-ph.game::after{inset:20% 8% 7% 8%}
.cover-ph.game .tag{position:absolute;top:4%;left:0;right:0;font-family:var(--pixel);font-size:clamp(5px,1.4vw,7px);color:#fff;letter-spacing:1px;z-index:1}
:is(.check-item,.result,.mosaic,.hl,.mosaic-wall) .cover-ph .t{font-size:9px;-webkit-line-clamp:3;word-break:normal;overflow-wrap:anywhere}
:is(.check-item,.result,.mosaic) .cover-ph :is(.orn,.a,.tag){display:none}
:is(.check-item,.result,.mosaic) .cover-ph{padding:8% 6% 8% 16%}
:is(.check-item,.result,.mosaic) .cover-ph.game{padding:20% 6% 6%}
.ribbon{position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(253,246,233,.85);border-top:2px solid var(--ink)}
.ribbon i{display:block;height:100%;background:var(--mint-deep)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:22px 16px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:28px 22px}}
.tile{border:0;background:none;padding:3px;text-align:left;cursor:pointer;min-width:0;color:inherit}
.tile:active .cover{transform:translateY(2px)}
.tile .meta{margin-top:12px}
.tile .tt{font-weight:600;font-size:15.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .sub{font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-row{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 14px;margin:0 -16px;padding-left:20px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.shelf-row::-webkit-scrollbar{display:none}
.shelf-row .tile{flex:none;width:118px;scroll-snap-align:start}
@media (min-width:900px){.shelf-row{margin:0;padding-left:4px}.shelf-row .tile{width:140px}}

/* ---------- bookshelf view ---------- */
.bookcase{padding:14px 12px 0;background:#8b6347;box-shadow:0 0 0 3px var(--ink),0 9px 0 3px var(--shadow);margin:3px}
.bookcase-inner{display:flex;flex-wrap:wrap;align-items:flex-end;background:#5e412f;
  background-image:repeating-linear-gradient(180deg,transparent 0 178px,var(--wood) 178px 192px,var(--wood-dark) 192px 196px)}
.slot{height:196px;display:flex;align-items:flex-end;padding:0 1px 18px}
.spine{border:0;cursor:pointer;padding:10px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink);
  box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 0 0 0 2px var(--ink);transition:transform .18s;position:relative}
.spine .st{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-style:italic;font-weight:600;font-size:12.5px;line-height:1;overflow:hidden;max-height:100%;white-space:nowrap;text-overflow:ellipsis;flex:1;min-height:0}
.spine .bands{width:100%;height:6px;border-top:2px solid rgba(90,62,43,.45);border-bottom:2px solid rgba(90,62,43,.45);margin:2px 0}
.spine .dot{width:8px;height:8px;background:rgba(255,255,255,.6);box-shadow:0 0 0 2px rgba(90,62,43,.4);margin-top:4px}
.spine.game{border-radius:6px 6px 0 0}
.spine.game .cap{width:100%;height:16px;background:rgba(90,62,43,.75);margin:-10px 0 6px}
.spine:active,.spine.pull{transform:translateY(-14px)}
.spine .prog{position:absolute;left:0;bottom:0;width:100%;background:rgba(124,196,160,.55)}
.decor-slot{height:196px;display:flex;align-items:flex-end;padding:0 6px 18px}
.decor-slot svg{width:44px}

/* ---------- hearts / bars ---------- */
.hearts{display:inline-flex;gap:3px;align-items:center}
.hearts svg{width:14px;height:12px}
.hearts.big{gap:8px}
.hearts.big button{border:0;background:none;padding:4px;cursor:pointer;position:relative}
.hearts.big svg{width:30px;height:26px}
.hearts.big button.pop svg{animation:pop .45s ease-out}
.hearts.big button.pop::after{content:"";position:absolute;inset:-6px;border:2px dashed #e8728f;animation:ring .5s ease-out forwards}
@keyframes pop{40%{transform:scale(1.45) rotate(-8deg)}}
@keyframes ring{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}
.bar{height:16px;background:#fff;border:2px solid var(--ink);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--pink-deep) 0 8px,var(--pink) 8px 16px)}
.bar.mintbar i{background:repeating-linear-gradient(90deg,var(--mint-deep) 0 8px,var(--mint) 8px 16px)}

/* ---------- home ---------- */
.hero{display:flex;gap:14px;align-items:center}
.hero .tw{position:relative;flex:none;width:90px}
.hero .toad{width:90px;animation:bob 3.5s ease-in-out infinite}
.hero .toad.sleep{animation:breathe 3s ease-in-out infinite}
.zzz{position:absolute;right:-6px;top:4px;font-family:var(--pixel);font-size:10px;color:var(--ink-soft);animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@keyframes breathe{50%{transform:scaleY(.95) translateY(2px)}}
.bubble{position:relative;background:#fff;padding:12px 14px;font-style:italic;box-shadow:0 0 0 2px var(--ink);margin-left:6px;color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:10px;height:10px;background:#fff;box-shadow:-2px 0 0 0 var(--ink),0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink);transform:translateY(-50%)}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:700px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 12px;text-align:center}
.stat .v{font-family:var(--pixel);font-size:17px;margin:10px 0 2px}
.quote{font-size:21px;font-style:italic;line-height:1.35}
.levelbox{display:flex;align-items:center;gap:14px}
.lv{font-family:var(--pixel);font-size:10px;background:var(--gold);padding:10px;border:2px solid var(--ink);white-space:nowrap}
.levelbox .grow{flex:1;min-width:0}
.empty{text-align:center;padding:26px 16px}
.empty .toad{width:70px;margin:0 auto 10px}
.nook{position:relative;height:210px;overflow:hidden;background:linear-gradient(180deg,#f3dcc4 0 70%,#d9b48f 70% 100%);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 22px),linear-gradient(180deg,#f3dcc4 0 70%,#d9b48f 70% 100%)}
.nook .plank{position:absolute;left:8%;right:8%;top:84px;height:12px;background:var(--wood);border:2px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.12)}
.nook .items{position:absolute;left:10%;right:10%;top:20px;height:64px;display:flex;justify-content:space-around;align-items:flex-end}
.nook .items svg{height:auto;width:46px}
.nook .items svg.cat-s{width:62px}
.nook .rug{position:absolute;left:50%;bottom:10px;width:150px;height:22px;margin-left:-75px;background:var(--pink);border:2px solid var(--ink);border-radius:50%}
.nook .toad{position:absolute;left:50%;bottom:20px;width:84px;margin-left:-42px;animation:bob 3.5s ease-in-out infinite}
.nook .win{position:absolute;right:7%;top:112px;width:56px;height:44px;border:3px solid var(--ink);background:linear-gradient(180deg,#cfe8f5,#eef6f3)}
.nook .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ink)}
body[data-sky=night] .nook .win{background:linear-gradient(180deg,#1f2244,#4f4570)}
.flicker{animation:flick 1.2s steps(2) infinite}
@keyframes flick{50%{filter:brightness(1.15)}}
.breathe{animation:breathe 3s ease-in-out infinite}

/* ---------- companion ---------- */
.companion{position:fixed;z-index:25;bottom:calc(76px + var(--safe-b));left:0;width:34px;cursor:pointer;animation:stroll 46s linear infinite;pointer-events:auto}
.companion svg{width:100%;animation:hop .6s steps(2) infinite}
.companion.bird svg{animation:hop .35s steps(2) infinite}
@keyframes stroll{0%{transform:translateX(-50px) scaleX(-1)}49%{transform:translateX(calc(100vw + 10px)) scaleX(-1)}50%{transform:translateX(calc(100vw + 10px)) scaleX(1)}100%{transform:translateX(-50px) scaleX(1)}}
@keyframes hop{50%{transform:translateY(-2px)}}
.companion .love{position:absolute;left:8px;top:-18px;width:16px;animation:love .9s ease-out forwards}
@keyframes love{to{transform:translateY(-26px);opacity:0}}
@media (min-width:900px){.companion{bottom:10px}}

/* ---------- detail ---------- */
.detail-top{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start}
@media (min-width:700px){.detail-top{grid-template-columns:220px 1fr;gap:30px}}
.detail-top .cover{animation:flip .55s cubic-bezier(.2,.8,.3,1);transform-origin:left center}
@keyframes flip{from{transform:perspective(600px) rotateY(-80deg);opacity:.3}}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:500px){.seg{grid-template-columns:repeat(4,1fr)}}
.seg button{border:2px solid var(--ink);background:#fff;padding:10px 4px;cursor:pointer;font-family:var(--pixel);font-size:7.5px;min-height:42px}
.seg button.on{background:var(--pink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.lockbox{display:flex;gap:12px;align-items:center;padding:14px;background:var(--parchment);border:2px dashed var(--ink-soft)}
.lockbox svg{width:26px;flex:none}
.coll-chips{display:flex;flex-wrap:wrap;gap:8px}
.qcard{padding:14px 16px}
.qcard .qt{font-style:italic;font-size:19px;line-height:1.4}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(90,62,43,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--cream);color:var(--ink);border-top:3px solid var(--ink);padding:18px 18px calc(24px + var(--safe-b));animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:2px solid var(--ink);background:#fff;width:38px;height:38px;cursor:pointer;font-family:var(--pixel);font-size:11px;flex:none;color:var(--ink)}
@media (min-width:700px){.modal-bg{align-items:center}.sheet{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--shadow);max-height:88vh;padding-bottom:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#scan-root .modal-bg{z-index:70}
#reader{width:100%;background:#000;min-height:220px}
#reader video{width:100%!important}
.results{display:grid;gap:10px;margin:12px 0}
.result{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:2px solid var(--ink);background:#fff;padding:8px;cursor:pointer;text-align:left}
.result:active{background:var(--pink-pale)}
.result .cover{box-shadow:0 0 0 2px var(--ink)}
.result b{display:block;line-height:1.2}
.cover-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px;margin:12px 0}
.cover-pick button{border:0;padding:3px;background:none;cursor:pointer}
.cover-pick button.on .cover{box-shadow:0 0 0 4px var(--pink-deep)}
.form-cover{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;margin-bottom:16px}
.typeswitch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.typeswitch button{border:2px solid var(--ink);background:#fff;padding:12px;cursor:pointer;font-family:var(--pixel);font-size:9px;display:flex;gap:8px;align-items:center;justify-content:center}
.typeswitch button.on{background:var(--pink)}
.typeswitch svg{width:16px;height:16px}
.note{font-size:15px;color:var(--ink-soft);font-style:italic}
.err{color:#b34a3a;font-size:15px}
.menu-list{display:grid;gap:10px}
.menu-list .nav-cloud{font-size:10px;padding:15px 18px}

/* ---------- journal ---------- */
.entry{padding:14px 16px}
.entry .when{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.entry p{margin:6px 0 0;white-space:pre-wrap}
.moods{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- stats ---------- */
.chart{width:100%;height:auto;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ach{padding:12px;text-align:center}
.ach svg.star{width:30px;height:30px;margin:0 auto 8px}
.ach.locked{opacity:.5;filter:grayscale(1)}
.ach b{display:block;font-size:16px;line-height:1.2}
.ach .small{font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dotted var(--ink-faint)}
.kv b{text-align:right}

/* ---------- year in review ---------- */
.review-hero{text-align:center;padding:26px 16px}
.review-hero .toad{width:110px;margin:0 auto 12px;animation:bob 2s ease-in-out infinite}
.big-num{font-family:var(--pixel);font-size:28px;margin:8px 0}
.mosaic-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px}
.mosaic-wall .cover{box-shadow:0 0 0 2px var(--ink)}
.hl{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;padding:12px 14px}
.hl .cover{box-shadow:0 0 0 2px var(--ink)}

/* ---------- collections ---------- */
.coll-card{border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:var(--parchment)}
.mosaic .cover{box-shadow:0 0 0 2px var(--ink)}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.check-list{display:grid;gap:8px;max-height:50vh;overflow:auto}
.check-item{display:grid;grid-template-columns:24px 40px 1fr;gap:10px;align-items:center;padding:6px 8px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.check-item input{width:20px;height:20px;accent-color:var(--pink-deep)}
.check-item .cover{box-shadow:0 0 0 2px var(--ink)}

/* ---------- shop ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.ware{padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ware .art{height:76px;display:flex;align-items:flex-end;justify-content:center}
.ware .art svg{height:68px;width:auto;max-width:100px}
.ware .art .swatch{width:80px;height:56px;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}
.ware b{line-height:1.2}
.ware .price{display:flex;gap:6px;align-items:center;font-family:var(--pixel);font-size:9px}
.ware .price svg{width:12px}
.ware.owned{background:var(--mint-pale)}
.ware.on{background:var(--pink-pale)}

/* ---------- session pill ---------- */
.session-pill{position:fixed;left:12px;right:84px;bottom:calc(86px + var(--safe-b));z-index:29;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;background:#fff;color:var(--ink)}
.session-pill svg{width:16px;flex:none;animation:flick 1s steps(2) infinite}
.session-pill .tx{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-pill .clock{font-family:var(--pixel);font-size:10px}
@media (min-width:900px){.session-pill{left:auto;right:100px;bottom:30px;width:360px}}

/* ---------- toast & celebration ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + var(--safe-t));z-index:90;width:min(92vw,380px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fff;color:var(--ink);animation:tin .25s ease-out;font-size:15px;line-height:1.25}
.toast.out{animation:tout .25s ease-in forwards}
.toast svg{width:24px;flex:none}
.toast b{display:block;font-size:15.5px}
.toast span{font-size:13.5px;color:var(--ink-soft)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
@keyframes tout{to{transform:translateY(-30px);opacity:0}}
.party{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(253,246,233,.86);animation:fade .2s;cursor:pointer;text-align:center;padding:20px}
.party .toad{width:150px;animation:jump .6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}10%{transform:translateY(0) scaleY(.85)}45%{transform:translateY(-38px) scaleY(1.05)}}
.party h1{margin-top:22px;color:var(--ink)}
.party .muted{margin-top:8px}
.confetti{position:fixed;top:-12px;width:9px;height:9px;z-index:96;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.banner{padding:12px 14px;margin-bottom:16px;background:#fff3d6;border:2px dashed var(--ink-soft);font-size:15px;color:var(--ink)}
.banner.cta{display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--pink-pale);border:2px solid var(--ink)}
.banner.cta svg{width:34px;flex:none}
</style>
</head>
<body data-sky="day">
<div class="sky" id="sky"></div>
<div class="weather" id="weather"></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>
</div>
<div id="companion-root"></div>
<div id="session-root"></div>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal-root"></div>
<div id="scan-root"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-cover" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>
<input type="file" id="file-scan" accept="image/*" capture="environment" hidden>
<script src="js/sprites.js"></script>
<script src="js/app.js"></script>
</body>
</html>
