<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivy &amp; the Hollow Shelf</title>
<meta name="theme-color" content="#f6c9d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hollow Shelf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fdf6e9; --parchment:#f6e8cf; --parchment-deep:#ecd8b5;
  --ink:#5a3e2b; --ink-soft:#8a6a52; --ink-faint:#b89b80;
  --pink:#f6c9d3; --pink-deep:#e58ba2; --pink-pale:#fde8ed;
  --mint:#c3e8d3; --mint-deep:#7cc4a0; --mint-pale:#e6f6ec;
  --sky:#d6ecf6; --lav:#ddd0f0; --gold:#ecc66f; --peach:#f8d3b5;
  --shadow:rgba(90,62,43,.16);
  --pixel:'Press Start 2P', monospace;
  --serif:'EB Garamond', Georgia, serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--ink);
  background:linear-gradient(180deg,#d9eef8 0%,#eef6f3 30%,var(--cream) 62%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
img{display:block}
a{color:var(--pink-deep)}
.pix{image-rendering:pixelated;display:block}

/* ---------- sky ---------- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:120px;opacity:.9;animation:drift linear infinite}
.cloud svg{width:100%;height:auto}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}

/* ---------- pixel boxes ---------- */
.px{background:var(--cream);margin:3px;
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 9px 0 var(--shadow)}
.px.soft{box-shadow:0 -2px 0 var(--ink-faint),0 2px 0 var(--ink-faint),-2px 0 0 var(--ink-faint),2px 0 0 var(--ink-faint)}
.card{padding:16px}
.pink{background:var(--pink-pale)} .mint{background:var(--mint-pale)} .parch{background:var(--parchment)}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:rgba(253,246,233,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid var(--ink)}
.topbar .brand{flex:1;min-width:0}
.brand-title{font-family:var(--serif);font-weight:600;font-style:italic;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--pixel);font-size:7px;letter-spacing:1px;color:var(--ink-soft);margin-top:4px}
.chip-stat{display:flex;align-items:center;gap:6px;font-family:var(--pixel);font-size:9px;background:var(--cream);padding:7px 8px;border:2px solid var(--ink)}
.chip-stat svg{width:14px;height:14px}
main{padding:18px 16px calc(110px + var(--safe-b));max-width:1100px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--cream);border-top:3px solid var(--ink);padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;cursor:pointer;min-height:48px}
.tabbar svg{width:24px;height:24px}
.tabbar span{font-family:var(--pixel);font-size:7px;color:var(--ink-soft)}
.tabbar button.on span{color:var(--ink)}
.tabbar button.on .tab-ico{background:var(--pink);box-shadow:0 0 0 2px var(--ink)}
.tab-ico{padding:3px 8px}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:31;width:58px;height:58px;border:0;cursor:pointer;
  background:var(--pink-deep);color:#fff;font-family:var(--pixel);font-size:22px;
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 8px 0 var(--shadow)}
.fab:active{transform:translateY(2px)}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:260px 1fr}
  .topbar,.tabbar{display:none}
  .fab{bottom:28px;right:28px}
  .sidebar{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;
    background:rgba(246,232,207,.88);border-right:3px solid var(--ink)}
  main{padding:30px 34px 120px;width:100%}
}
.side-brand{text-align:center;padding:6px 0 4px}
.side-brand .toad{width:84px;margin:0 auto 6px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.nav-cloud{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;cursor:pointer;padding:11px 14px;margin:3px 0;text-align:left;
  font-family:var(--pixel);font-size:9px;color:var(--ink);border-radius:999px;box-shadow:0 0 0 3px var(--ink),0 5px 0 3px var(--shadow);transition:transform .15s}
.nav-cloud:hover{transform:translateX(3px)}
.nav-cloud.on{background:var(--pink)}
.nav-cloud svg{width:18px;height:18px;flex:none}
.side-level{padding:12px}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:32px;font-style:italic;line-height:1.1}
h2{font-size:23px;font-style:italic}
h3{font-size:19px}
.label{font-family:var(--pixel);font-size:8px;letter-spacing:.5px;color:var(--ink-soft);text-transform:uppercase}
.muted{color:var(--ink-soft)}
.small{font-size:15px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.section{margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:14px}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;font-family:var(--pixel);font-size:9px;line-height:1.3;padding:12px 14px;margin:3px;background:var(--cream);color:var(--ink);
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 6px 0 var(--shadow);min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--pink)}
.btn.mint{background:var(--mint)}
.btn.danger{background:#f3c1b5}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline;padding:8px}
.btn.sm{font-size:8px;padding:8px 10px;min-height:32px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:14px;height:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--pixel);font-size:8px;color:var(--pink-deep);text-decoration:underline}

/* ---------- chips / tabs ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 10px;scrollbar-width:none;margin:0 -16px;padding-left:19px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{margin:0;padding-left:3px}}
.chip{flex:none;border:2px solid var(--ink);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:var(--pixel);font-size:8px;white-space:nowrap}
.chip.on{background:var(--pink)}
.chip .n{opacity:.6;margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--pixel);font-size:7px;padding:5px 7px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.badge svg{width:10px;height:10px}
.b-want{background:var(--lav)} .b-active{background:var(--mint)} .b-finished{background:var(--gold)} .b-dnf{background:#e8d9cc}

/* ---------- forms ---------- */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-family:var(--pixel);font-size:8px;color:var(--ink-soft);margin:0 0 7px}
.inp{width:100%;border:2px solid var(--ink);background:#fff;padding:11px 12px;border-radius:0;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{background:var(--pink-pale)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-row{display:flex;gap:8px}
.search-row .inp{flex:1}

/* ---------- covers ---------- */
.cover{position:relative;aspect-ratio:3/4;width:100%;overflow:hidden;background:var(--parchment-deep);
  box-shadow:0 0 0 3px var(--ink),0 7px 0 3px var(--shadow)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10% 9%;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 4px,transparent 4px 8px)}
.cover-ph .t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(12px,3.4vw,17px);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.cover-ph .ico{width:26%;align-self:flex-end}
.cover-ph::before{content:"";position:absolute;inset:6%;border:2px dashed rgba(90,62,43,.35)}
.ribbon{position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(253,246,233,.85);border-top:2px solid var(--ink)}
.ribbon i{display:block;height:100%;background:var(--mint-deep)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:22px 16px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:28px 22px}}
.tile{border:0;background:none;padding:3px;text-align:left;cursor:pointer;min-width:0}
.tile:active .cover{transform:translateY(2px)}
.tile .meta{margin-top:12px}
.tile .tt{font-weight:600;font-size:15.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .sub{font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{margin-top:6px}
.shelf-row{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 14px;margin:0 -16px;padding-left:20px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.shelf-row::-webkit-scrollbar{display:none}
.shelf-row .tile{flex:none;width:118px;scroll-snap-align:start}
@media (min-width:900px){.shelf-row{margin:0;padding-left:4px}.shelf-row .tile{width:140px}}

/* ---------- hearts / bars ---------- */
.hearts{display:inline-flex;gap:3px;align-items:center}
.hearts svg{width:14px;height:12px}
.hearts.big{gap:8px}
.hearts.big button{border:0;background:none;padding:4px;cursor:pointer}
.hearts.big svg{width:30px;height:26px}
.bar{height:16px;background:#fff;border:2px solid var(--ink);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--pink-deep) 0 8px,#ef9db2 8px 16px)}
.bar.mintbar i{background:repeating-linear-gradient(90deg,var(--mint-deep) 0 8px,#98d3b4 8px 16px)}

/* ---------- home ---------- */
.hero{display:flex;gap:14px;align-items:center}
.hero .toad{width:86px;flex:none;animation:bob 3.5s ease-in-out infinite}
.bubble{position:relative;background:#fff;padding:12px 14px;font-style:italic;box-shadow:0 0 0 2px var(--ink);margin-left:6px}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:10px;height:10px;background:#fff;box-shadow:-2px 0 0 0 var(--ink),0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink);transform:translateY(-50%)}
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:700px){.stats4{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 12px;text-align:center}
.stat .v{font-family:var(--pixel);font-size:17px;margin:10px 0 2px}
.quote{font-size:21px;font-style:italic;line-height:1.35}
.levelbox{display:flex;align-items:center;gap:14px}
.lv{font-family:var(--pixel);font-size:10px;background:var(--gold);padding:10px;border:2px solid var(--ink);white-space:nowrap}
.levelbox .grow{flex:1;min-width:0}
.empty{text-align:center;padding:26px 16px}
.empty .toad{width:70px;margin:0 auto 10px}

/* ---------- detail ---------- */
.detail-top{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start}
@media (min-width:700px){.detail-top{grid-template-columns:220px 1fr;gap:30px}}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:500px){.seg{grid-template-columns:repeat(4,1fr)}}
.seg button{border:2px solid var(--ink);background:#fff;padding:10px 4px;cursor:pointer;font-family:var(--pixel);font-size:7.5px;min-height:42px}
.seg button.on{background:var(--pink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.lockbox{display:flex;gap:12px;align-items:center;padding:14px;background:var(--parchment);border:2px dashed var(--ink-soft)}
.lockbox svg{width:26px;flex:none}
.coll-chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(90,62,43,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--cream);border-top:3px solid var(--ink);padding:18px 18px calc(24px + var(--safe-b));animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:2px solid var(--ink);background:#fff;width:38px;height:38px;cursor:pointer;font-family:var(--pixel);font-size:11px;flex:none}
@media (min-width:700px){.modal-bg{align-items:center}.sheet{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--shadow);max-height:88vh;padding-bottom:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.results{display:grid;gap:10px;margin:12px 0}
.result{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:2px solid var(--ink);background:#fff;padding:8px;cursor:pointer;text-align:left}
.result:active{background:var(--pink-pale)}
.result .cover{box-shadow:0 0 0 2px var(--ink)}
.result b{display:block;line-height:1.2}
.cover-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px;margin:12px 0}
.cover-pick button{border:0;padding:3px;background:none;cursor:pointer}
.cover-pick button.on .cover{box-shadow:0 0 0 4px var(--pink-deep)}
.form-cover{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;margin-bottom:16px}
.typeswitch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.typeswitch button{border:2px solid var(--ink);background:#fff;padding:12px;cursor:pointer;font-family:var(--pixel);font-size:9px;display:flex;gap:8px;align-items:center;justify-content:center}
.typeswitch button.on{background:var(--pink)}
.typeswitch svg{width:16px;height:16px}
.note{font-size:15px;color:var(--ink-soft);font-style:italic}
.err{color:#b34a3a;font-size:15px}
.menu-list{display:grid;gap:10px}
.menu-list .nav-cloud{font-size:10px;padding:15px 18px}

/* ---------- journal ---------- */
.entry{padding:14px 16px}
.entry .when{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.entry p{margin:6px 0 0;white-space:pre-wrap}
.moods{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- stats ---------- */
.chart{width:100%;height:auto;display:block}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ach{padding:12px;text-align:center}
.ach svg.star{width:30px;height:30px;margin:0 auto 8px}
.ach.locked{opacity:.5;filter:grayscale(1)}
.ach b{display:block;font-size:16px;line-height:1.2}
.ach .small{font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dotted var(--ink-faint)}

/* ---------- collections ---------- */
.coll-card{border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:var(--parchment)}
.mosaic .cover{box-shadow:0 0 0 2px var(--ink)}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.check-list{display:grid;gap:8px;max-height:50vh;overflow:auto}
.check-item{display:grid;grid-template-columns:24px 40px 1fr;gap:10px;align-items:center;padding:6px 8px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.check-item input{width:20px;height:20px;accent-color:var(--pink-deep)}
.check-item .cover{box-shadow:0 0 0 2px var(--ink)}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));z-index:90;display:grid;gap:10px;width:min(92vw,420px)}
.toast{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;animation:up .25s ease-out}
.toast svg{width:34px;flex:none}
.toast b{display:block}
.banner{padding:12px 14px;margin-bottom:16px;background:#fff3d6;border:2px dashed var(--ink-soft);font-size:15px}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>
</div>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-cover" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   Ivy & the Hollow Shelf — personal book & game tracker
   Single-file app. Data lives in this device's IndexedDB.
   ===================================================================== */

/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDay(new Date());
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : d; };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtHours = h => (Math.round(h * 10) / 10).toLocaleString('en-GB');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- pixel art (original sprites) ---------- */
const INK = '#5a3e2b';
function pix(rows, pal, cls = '') {
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = pal[row[x]]; if (c) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`; } });
  return `<svg class="pix ${cls}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const TOAD = [
  '...oo......oo...',
  '..owwo.pp.owwo..',
  '..owko.pp.okwo..',
  '.ogllgoooogllgo.',
  'oggggggggggggggo',
  'ogpggggggggggpgo',
  'oggggggooggggggo',
  '.oggccccccccggo.',
  '.ogccccccccccgo.',
  'ogggccccccccgggo',
  'oglgoccccccoglgo',

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB.name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB.store);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function loadState() {
  try {
    const db = await idb();
    const v = await new Promise((res, rej) => { const q = db.transaction(IDB.store).objectStore(IDB.store).get('state'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    if (v) return v;
  } catch (e) { console.warn('IndexedDB unavailable', e); }
  try { const j = localStorage.getItem(IDB.name); if (j) return JSON.parse(j); } catch (e) {}
  return null;
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const db = await idb();
      await new Promise((res, rej) => { const t = db.transaction(IDB.store, 'readwrite'); t.objectStore(IDB.store).put(S, 'state'); t.oncomplete = res; t.onerror = () => rej(t.error); });
      storageOK = true;
    } catch (e) {
      try { localStorage.setItem(IDB.name, JSON.stringify(S)); storageOK = true; } catch (e2) { storageOK = false; render(); }
    }
  }, 250);
}
function normalize(s) {

}

function progressNumbers() {

  const reviews = S.items.filter(i => i.status === 'finished' && (i.review || '').trim()).length;
  const unlocked = ACH.filter(a => S.achievements[a.id]);
  let xp = Math.floor(pages / 5) + Math.floor(hours * 10) + fin * 100 + reviews * 25 + S.journal.length * 15 + unlocked.reduce((a, x) => a + x.xp, 0);
  const acorns = fin * 5 + S.journal.length * 2 + unlocked.reduce((a, x) => a + x.ac, 0);
  let level = 1, need = 100, into = xp;
  while (into >= need) { into -= need; level++; need = Math.round(need * 1.2); }
  return { xp, level, into, need, acorns };
}

  return it.total_hours ? Math.min(100, Math.round((it.hours_played || 0) / it.total_hours * 100)) : 0;

function resizeImage(file, w = 360, h = 480) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
      const r = Math.max(w / img.width, h / img.height), dw = img.width * r, dh = img.height * r;
      x.imageSmoothingEnabled = !(img.width <= 200); // keep tiny pixel art crisp
      x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
    img.src = url;
  });
}

/* ---------- book lookup (Open Library → Google Books) ---------- */
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
const shortGenre = arr => (arr || []).map(s => String(s)).find(s => s.length < 26 && !/fiction in english|accessible book|protected daisy|large type|nyt:|reading level|^\d/i.test(s)) || '';
async function searchOpenLibrary(q) {
  const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=15&fields=key,title,author_name,cover_i,number_of_pages_median,first_publish_year,isbn,subject`);
  return (j.docs || []).map(d => ({
    source: 'Open Library', title: d.title, author: (d.author_name || []).slice(0, 2).join(', '),
    total_pages: d.number_of_pages_median || '', year: d.first_publish_year || '', isbn: (d.isbn || [])[0] || '',
    open_library_id: d.key || '', genre: shortGenre(d.subject),
    cover_url: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : ''
  }));
}
async function searchGoogle(q) {
  const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=15&printType=books`);
  return (j.items || []).map(v => { const i = v.volumeInfo || {}; const img = (i.imageLinks || {}); const isbn = (i.industryIdentifiers || []).find(x => /ISBN_13/.test(x.type)) || (i.industryIdentifiers || [])[0];
    return { source: 'Google Books', title: i.title + (i.subtitle ? ': ' + i.subtitle : ''), author: (i.authors || []).slice(0, 2).join(', '), total_pages: i.pageCount || '',
      year: (i.publishedDate || '').slice(0, 4), isbn: isbn ? isbn.identifier : '', open_library_id: '', genre: shortGenre(i.categories), synopsis: i.description || '',
      cover_url: (img.thumbnail || img.smallThumbnail || '').replace('http://', 'https://').replace('&edge=curl', '') }; });
}
async function olDescription(key) {
  try { const j = await getJSON(`https://openlibrary.org${key}.json`); const d = j.description; return typeof d === 'string' ? d : (d && d.value) || ''; } catch (e) { return ''; }
}
async function olEditions(key) {
  const j = await getJSON(`https://openlibrary.org${key}/editions.json?limit=60`);
  return (j.entries || []).filter(e => (e.covers || []).some(c => c > 0)).map(e => ({
    cover_url: `https://covers.openlibrary.org/b/id/${e.covers.find(c => c > 0)}-L.jpg`,
    total_pages: e.number_of_pages || '', isbn: (e.isbn_13 || e.isbn_10 || [])[0] || '',
    label: [(e.publishers || [])[0], e.publish_date, (e.languages || []).map(l => l.key.split('/').pop()).join('/')].filter(Boolean).join(' · ')
  }));
}

    <div class="px stat pink"><div class="label">Books ${y}</div><div class="v">${done}${goal ? `<span class="small muted">/${goal}</span>` : ''}</div><div class="small muted">finished</div></div>
    <div class="px stat mint"><div class="label">Pages</div><div class="v">${Math.max(0, sumLogs('pages', l => l.date.startsWith(mo))).toLocaleString('en-GB')}</div><div class="small muted">this month</div></div>
    <div class="px stat"><div class="label">Hours</div><div class="v">${fmtHours(Math.max(0, sumLogs('hours', l => l.date.startsWith(mo))))}</div><div class="small muted">played this month</div></div>

  <div class="section"><h2>Currently reading</h2>${reading.length ? `<button class="link" data-act="go" data-r="books">See all</button>` : ''}</div>
  ${reading.length ? `<div class="shelf-row">${reading.map(tile).join('')}</div>` : emptyBox('Nothing on the nightstand yet.', `<button class="btn primary" data-act="add" data-type="book">Add a book</button>`)}
  <div class="section"><h2>Currently playing</h2>${playing.length ? `<button class="link" data-act="go" data-r="games">See all</button>` : ''}</div>
  ${playing.length ? `<div class="shelf-row">${playing.map(tile).join('')}</div>` : emptyBox('No adventures in progress.', `<button class="btn mint" data-act="add" data-type="game">Add a game</button>`)}
  <div class="section"><h2>Quote of the day</h2></div>
  <div class="px card pink"><div class="quote">“${esc(q[0])}”</div><div class="label" style="margin-top:12px">— ${esc(q[1])}</div></div>
  ${recent.length ? `<div class="section"><h2>Recent achievements</h2><button class="link" data-act="go" data-r="stats">All</button></div><div class="ach-grid">${recent.map(a => achCard(a)).join('')}</div>` : ''}`;
}

function viewShelf(type) {
  const f = ui[type === 'book' ? 'books' : 'games'], all = S.items.filter(i => i.type === type);
  let list = all.filter(i => f.status === 'all' || i.status === f.status);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(i => [i.title, i.author, i.genre, i.platform].join(' ').toLowerCase().includes(q)); }
  if (type === 'book' && f.genre) list = list.filter(i => i.genre === f.genre);
  if (type === 'game' && f.platform) list = list.filter(i => i.platform === f.platform);
  const sorters = { updated: (a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''), title: (a, b) => a.title.localeCompare(b.title), author: (a, b) => (a.author || a.platform || '').localeCompare(b.author || b.platform || ''), rating: (a, b) => (b.rating || 0) - (a.rating || 0), progress: (a, b) => pct(b) - pct(a) };
  list.sort(sorters[f.sort] || sorters.updated);
  const extra = type === 'book' ? [...new Set(all.map(i => i.genre).filter(Boolean))].sort() : [...new Set(all.map(i => i.platform).filter(Boolean))].sort();
  const key = type === 'book' ? 'genre' : 'platform';
  return `
  <div class="page-head"><div><div class="label">${type === 'book' ? 'The shelf' : 'The arcade'}</div><h1>${type === 'book' ? 'Library' : 'Games'}</h1></div>
    <button class="btn ${type === 'book' ? 'primary' : 'mint'}" data-act="add" data-type="${type}">+ Add ${type}</button></div>
  <div class="chips">${['all', ...STATUS].map(s => `<button class="chip ${f.status === s ? 'on' : ''}" data-act="filter" data-type="${type}" data-k="status" data-v="${s}">${s === 'all' ? 'All' : LABEL[type][s]}<span class="n">${s === 'all' ? all.length : all.filter(i => i.status === s).length}</span></button>`).join('')}</div>
  <div class="grid2" style="margin:6px 0 22px">
    <input class="inp" type="search" placeholder="Search…" value="${esc(f.q)}" data-input="shelfq" data-type="${type}">
    <div class="grid2" style="gap:8px">
      <select class="inp" data-change="shelfsort" data-type="${type}" aria-label="Sort">${[['updated', 'Recent'], ['title', 'Title'], ['author', type === 'book' ? 'Author' : 'Platform'], ['rating', 'Hearts'], ['progress', 'Progress']].map(([v, n]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <select class="inp" data-change="shelfextra" data-type="${type}" aria-label="${key}"><option value="">${type === 'book' ? 'All genres' : 'All platforms'}</option>${extra.map(g => `<option ${f[key] === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
    </div>
  </div>
  <div id="shelf-grid">${shelfGrid(list, type, all.length)}</div>`;
}
function shelfGrid(list, type, total) {
  if (!list.length) return total ? emptyBox('Nothing matches that filter.') : emptyBox(type === 'book' ? 'Your shelf is waiting for its first book.' : 'No games yet — let’s add one!', `<button class="btn primary" data-act="add" data-type="${type}">Add ${type}</button>`);
  return `<div class="grid">${list.map(tile).join('')}</div>`;
}

function viewWishlist() {
  const wb = books().filter(i => i.status === 'want'), wg = games().filter(i => i.status === 'want');
  const block = (arr, type) => arr.length ? `<div class="grid">${arr.map(it => `<div>${tile(it)}<button class="btn sm ${type === 'book' ? 'primary' : 'mint'}" style="width:calc(100% - 6px);margin-top:10px" data-act="start" data-id="${it.id}">${type === 'book' ? 'Start reading' : 'Start playing'}</button></div>`).join('')}</div>` : emptyBox(type === 'book' ? 'No books on the wishlist.' : 'No games on the wishlist.', `<button class="btn" data-act="add" data-type="${type}" data-status="want">Add to wishlist</button>`);
  return `<div class="page-head"><div><div class="label">Someday soon</div><h1>Wishlist</h1></div></div>
  <div class="section"><h2>Books to read</h2></div>${block(wb, 'book')}
  <div class="section"><h2>Games to play</h2></div>${block(wg, 'game')}`;
}

  const entries = S.journal.filter(j => j.itemId === id).sort((a, b) => b.date.localeCompare(a.date));
  const p = pct(it);
  return `
  <button class="link" data-act="back" style="margin-bottom:16px">← Back</button>
  <div class="detail-top">
    <div>${coverHTML(it)}</div>
    <div class="stack">
      <div><span class="badge b-${it.status}">${B ? bookIco() : padIco()} ${L[it.status]}</span></div>

      <div class="row"><button class="btn sm" data-act="edit" data-id="${id}">Edit</button>${it.steam_appid ? `<a class="btn sm" href="https://store.steampowered.com/app/${esc(it.steam_appid)}" target="_blank" rel="noopener">Steam ↗</a>` : ''}</div>
    </div>
  </div>

  <div class="section"><h2>Status</h2></div>
  <div class="seg">${STATUS.map(s => `<button class="${it.status === s ? 'on' : ''}" data-act="status" data-id="${id}" data-s="${s}">${L[s]}</button>`).join('')}</div>

  <div class="section"><h2>Progress</h2><span class="label">${B ? (it.total_pages ? p + '%' : '') : (it.total_hours ? p + '%' : '')}</span></div>
  <div class="px card">
    ${B ? `
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="grid2" style="margin-top:16px">
        <label class="field"><span>CURRENT PAGE</span><input class="inp" type="number" inputmode="numeric" min="0" value="${it.current_page || 0}" data-change="page" data-id="${id}"></label>
        <label class="field"><span>TOTAL PAGES</span><input class="inp" type="number" inputmode="numeric" min="0" value="${it.total_pages || ''}" data-change="total" data-id="${id}"></label>
      </div>
      <div class="quick">${[5, 10, 25, 50].map(n => `<button class="btn sm" data-act="bump" data-id="${id}" data-n="${n}">+${n} pages</button>`).join('')}</div>`
    : `
      ${it.total_hours ? `<div class="bar mintbar"><i style="width:${p}%"></i></div>` : ''}
      <div class="grid2" style="margin-top:${it.total_hours ? 16 : 0}px">
        <label class="field"><span>HOURS PLAYED</span><input class="inp" type="number" inputmode="decimal" step="0.5" min="0" value="${it.hours_played || 0}" data-change="hours" data-id="${id}"></label>
        <label class="field"><span>HOURS TO BEAT (EST.)</span><input class="inp" type="number" inputmode="decimal" step="1" min="0" value="${it.total_hours || ''}" placeholder="optional" data-change="total" data-id="${id}"></label>
      </div>
      <div class="quick">${[0.5, 1, 2, 3].map(n => `<button class="btn sm mint" data-act="bump" data-id="${id}" data-n="${n}">+${n}h</button>`).join('')}</div>`}
    <div class="grid2" style="margin-top:16px">
      <label class="field"><span>STARTED</span><input class="inp" type="date" value="${it.date_started || ''}" data-change="date" data-k="date_started" data-id="${id}"></label>
      <label class="field"><span>FINISHED</span><input class="inp" type="date" value="${it.date_finished || ''}" data-change="date" data-k="date_finished" data-id="${id}"></label>
    </div>
  </div>

  <div class="section"><h2>Review</h2></div>
  ${fin ? `<textarea class="inp" placeholder="What did you think?" data-change="review" data-id="${id}">${esc(it.review || '')}</textarea>`
    : `<div class="lockbox">${lockIco()}<div><b>Locked until ${B ? 'read' : 'completed'}</b><div class="small muted">Finish it first, then come back and tell the toad everything.</div></div></div>`}

  <div class="section"><h2>Notes</h2></div>
  <textarea class="inp" placeholder="Quotes, thoughts, where you left off…" data-change="notes" data-id="${id}">${esc(it.notes || '')}</textarea>

  ${it.synopsis ? `<div class="section"><h2>Synopsis</h2></div><div class="px card parch small" style="white-space:pre-wrap">${esc(it.synopsis)}</div>` : ''}

  <div class="section"><h2>Collections</h2><button class="link" data-act="newcoll" data-id="${id}">+ New</button></div>
  ${S.collections.length ? `<div class="coll-chips">${S.collections.map(c => `<button class="chip ${c.itemIds.includes(id) ? 'on' : ''}" data-act="togglecoll" data-c="${c.id}" data-id="${id}">${c.itemIds.includes(id) ? '✓ ' : ''}${esc(c.name)}</button>`).join('')}</div>` : `<p class="note">No collections yet.</p>`}

  <div class="section"><h2>Journal</h2><button class="link" data-act="journalfor" data-id="${id}">+ Write</button></div>
  ${entries.length ? `<div class="stack">${entries.map(entryCard).join('')}</div>` : `<p class="note">No entries about this one yet.</p>`}

  return `<div class="page-head"><div><div class="label">Little shelves</div><h1>Collections</h1></div><button class="btn primary" data-act="newcoll">+ New collection</button></div>

      <div class="card" style="padding:12px 14px"><h3>${esc(c.name)}</h3><div class="small muted">${its.length} item${its.length === 1 ? '' : 's'}${c.description ? ' · ' + esc(c.description) : ''}</div></div></div></button>`;
  }).join('')}</div>` : emptyBox('Group things into little shelves — “Autumn reads”, “Cozy games”, “Books Mum lent me”.', `<button class="btn primary" data-act="newcoll">Create one</button>`)}`;

function viewCollection(cid) {

}

function entryCard(e) {
  const it = e.itemId ? byId(e.itemId) : null;
  return `<div class="px card entry"><div class="when"><span class="label">${fmtDate(e.date)}${e.mood ? ' · ' + esc(e.mood) : ''}</span><span class="row" style="gap:4px"><button class="link" data-act="editentry" data-e="${e.id}">Edit</button></span></div>
    ${it ? `<button class="link" data-act="open" data-id="${it.id}" style="font-size:8px">${it.type === 'book' ? '\u{1F4D6}' : '\u{1F3AE}'} ${esc(it.title)}</button>` : ''}<p>${esc(e.text)}</p></div>`;
}
function viewJournal() {
  let list = [...S.journal].sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));
  if (ui.journalItem) list = list.filter(e => e.itemId === ui.journalItem);
  const groups = {}; list.forEach(e => { const k = e.date.slice(0, 7); (groups[k] = groups[k] || []).push(e); });
  const linked = [...new Set(S.journal.map(j => j.itemId).filter(Boolean))].map(byId).filter(Boolean);
  return `<div class="page-head"><div><div class="label">Dear diary</div><h1>Journal</h1></div><button class="btn primary" data-act="newentry">+ New entry</button></div>
  ${linked.length ? `<select class="inp" data-change="journalfilter" style="margin-bottom:18px"><option value="">All entries</option>${linked.map(i => `<option value="${i.id}" ${ui.journalItem === i.id ? 'selected' : ''}>${esc(i.title)}</option>`).join('')}</select>` : ''}
  ${list.length ? Object.keys(groups).map(k => { const [y, m] = k.split('-'); return `<div class="section"><h2>${MONTHS[+m - 1]} ${y}</h2></div><div class="stack">${groups[k].map(entryCard).join('')}</div>`; }).join('')
    : emptyBox('Write a few lines about what you’re reading or playing — a favourite moment, a quote, how it made you feel.', `<button class="btn primary" data-act="newentry">Write the first entry</button>`)}`;
}

function barChart(vals, color, unit) {
  const W = 360, H = 150, max = Math.max(1, ...vals), bw = W / 12;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 22}" shape-rendering="crispEdges">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="${INK}" stroke-width="2"/>
    ${vals.map((v, i) => { const h = Math.round(v / max * (H - 18)); return `<g><title>${MONTHS[i]}: ${unit === 'h' ? fmtHours(v) + ' h' : Math.round(v) + ' pages'}</title><rect x="${i * bw + 5}" y="${H - h}" width="${bw - 10}" height="${h}" fill="${color}" stroke="${INK}" stroke-width="2"/>${v ? `<text x="${i * bw + bw / 2}" y="${H - h - 5}" font-size="9" text-anchor="middle" fill="${INK}" font-family="EB Garamond">${unit === 'h' ? fmtHours(v) : Math.round(v)}</text>` : ''}<text x="${i * bw + bw / 2}" y="${H + 16}" font-size="10" text-anchor="middle" fill="#8a6a52" font-family="EB Garamond">${MONTHS[i][0]}</text></g>`; }).join('')}
  </svg>`;
}
function achCard(a) {
  const got = S.achievements[a.id];
  return `<div class="px ach ${got ? '' : 'locked'}">${starIco()}<b>${esc(a.name)}</b><div class="small muted">${esc(a.desc)}</div><div class="label" style="margin-top:8px">${got ? fmtDate(got) : `+${a.xp} XP · +${a.ac}`}</div></div>`;
}
function viewStats() {
  const y = ui.statsYear;
  const years = [...new Set([new Date().getFullYear(), ...S.logs.map(l => +l.date.slice(0, 4)), ...S.items.map(i => +(i.date_finished || '').slice(0, 4)).filter(Boolean)])].sort((a, b) => b - a);
  const inY = l => l.date.startsWith(String(y));
  const pagesM = Array(12).fill(0), hoursM = Array(12).fill(0);
  S.logs.filter(inY).forEach(l => { const m = +l.date.slice(5, 7) - 1; (l.unit === 'pages' ? pagesM : hoursM)[m] += l.amount; });
  pagesM.forEach((v, i) => pagesM[i] = Math.max(0, v)); hoursM.forEach((v, i) => hoursM[i] = Math.max(0, v));
  const fb = finishedIn('book', y), fg = finishedIn('game', y);
  const rated = S.items.filter(i => i.rating);
  const avg = rated.length ? (rated.reduce((a, i) => a + i.rating, 0) / rated.length).toFixed(1) : '—';
  const genres = {}; books().forEach(b => { if (b.genre) genres[b.genre] = (genres[b.genre] || 0) + 1; });
  const topG = Object.entries(genres).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const plats = {}; games().forEach(g => { if (g.platform) plats[g.platform] = (plats[g.platform] || 0) + (g.hours_played || 0); });
  const topP = Object.entries(plats).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const longest = fb.filter(b => b.total_pages).sort((a, b) => b.total_pages - a.total_pages)[0];
  const p = progressNumbers();
  return `<div class="page-head"><div><div class="label">The almanac</div><h1>Stats</h1></div>
    <select class="inp" style="width:auto" data-change="statsyear">${years.map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="stats4">
    <div class="px stat pink"><div class="label">Books read</div><div class="v">${fb.length}</div></div>
    <div class="px stat mint"><div class="label">Pages</div><div class="v">${Math.round(pagesM.reduce((a, b) => a + b, 0)).toLocaleString('en-GB')}</div></div>
    <div class="px stat parch"><div class="label">Games done</div><div class="v">${fg.length}</div></div>
    <div class="px stat"><div class="label">Hours</div><div class="v">${fmtHours(hoursM.reduce((a, b) => a + b, 0))}</div></div>
  </div>
  <div class="section"><h2>Pages per month</h2></div><div class="px card">${barChart(pagesM, '#f29bb2', 'p')}</div>
  <div class="section"><h2>Hours per month</h2></div><div class="px card">${barChart(hoursM, '#8fcfa8', 'h')}</div>
  <div class="section"><h2>Little facts</h2></div>
  <div class="px card">
    <div class="kv"><span>Average hearts given</span><b>${avg}</b></div>
    <div class="kv"><span>Longest book read in ${y}</span><b>${longest ? esc(longest.title) + ' (' + longest.total_pages + ' p)' : '—'}</b></div>
    <div class="kv"><span>Did not finish (all time)</span><b>${S.items.filter(i => i.status === 'dnf').length}</b></div>
    <div class="kv"><span>Journal entries</span><b>${S.journal.length}</b></div>
    <div class="kv"><span>Total XP</span><b>${p.xp.toLocaleString('en-GB')}</b></div>
    <div class="kv" style="border:0"><span>Longest streak right now</span><b>${streak()} days</b></div>
  </div>
  ${topG.length ? `<div class="section"><h2>Favourite genres</h2></div><div class="px card">${topG.map(([g, n]) => `<div class="kv"><span>${esc(g)}</span><b>${n}</b></div>`).join('')}</div>` : ''}
  ${topP.length ? `<div class="section"><h2>Hours by platform</h2></div><div class="px card">${topP.map(([g, n]) => `<div class="kv"><span>${esc(g)}</span><b>${fmtHours(n)} h</b></div>`).join('')}</div>` : ''}
  <div class="section"><h2>Achievements</h2><span class="label">${Object.keys(S.achievements).length}/${ACH.length}</span></div>
  <div class="ach-grid">${ACH.map(achCard).join('')}</div>
  <p class="note" style="margin-top:16px">${acorn().replace('class="pix ', 'style="width:14px;display:inline-block;vertical-align:middle" class="pix ')} Acorns pile up as you finish things and unlock achievements — what they buy is still to be decided.</p>`;
}

/* ---------- modal & toasts ---------- */
function openModal(title, body, onMount) {
  $('#modal-root').innerHTML = `<div class="modal-bg" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2>${title}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><div id="sheet-body">${body}</div></div></div>`;
  document.body.style.overflow = 'hidden';
  onMount && onMount();
}
function closeModal() { $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; draft = null; }
function toast(html, ico = toad()) {
  const t = document.createElement('div'); t.className = 'px toast'; t.innerHTML = ico + `<div>${html}</div>`;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200);
}
function askConfirm(text, yes, okLabel = 'Yes', danger = true) {
  openModal('Are you sure?', `<p>${text}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-yes">${okLabel}</button></div>`,
    () => { $('#confirm-yes').onclick = () => { closeModal(); yes(); }; });
}

async function doSearch(q) {
  const box = $('#results'); if (!q.trim() || !box) return;
  box.innerHTML = `<p class="note">Looking through the stacks…</p>`;
  let res = [], err = '';
  try { res = await searchOpenLibrary(q); } catch (e) { err = e; }
  if (!res.length) { try { res = await searchGoogle(q); } catch (e) { err = e; } }
  lastResults = res;
  if (!res.length) { box.innerHTML = `<p class="${err ? 'err' : 'note'}">${err ? 'Couldn’t reach the book catalogues — are you online? You can still fill it in by hand below.' : 'Nothing found. Try fewer words, or fill it in by hand below.'}</p>`; return; }
  box.innerHTML = `<div class="results">${res.map((r, i) => `<button class="result" data-act="pick" data-i="${i}">${coverHTML({ ...r, type: 'book' }, true)}<div><b>${esc(r.title)}</b><span class="small muted">${esc(r.author)}${r.year ? ' · ' + r.year : ''}${r.total_pages ? ' · ' + r.total_pages + ' p' : ''}</span></div></button>`).join('')}</div>
    ${res[0].source === 'Open Library' ? `<button class="link" data-act="google" data-q="${esc(q)}">Not here? Search Google Books</button>` : ''}`;
}
async function pickResult(r) {
  Object.assign(draft, { title: r.title, author: r.author, total_pages: r.total_pages || draft.total_pages, isbn: r.isbn, open_library_id: r.open_library_id, genre: r.genre || draft.genre, cover_url: r.cover_url || draft.cover_url, synopsis: r.synopsis || draft.synopsis, cover_fallbacks: [] });
  rerenderForm();
  if (r.open_library_id && !r.synopsis) { const s = await olDescription(r.open_library_id); if (s && draft && !draft.synopsis) { draft.synopsis = s; const t = $('textarea[data-k="synopsis"]'); if (t) t.value = s; } }
}
async function showEditions() {
  const box = $('#editions'); box.innerHTML = `<p class="note">Gathering editions…</p>`;
  try {
    const eds = await olEditions(draft.open_library_id);
    if (!eds.length) { box.innerHTML = `<p class="note">No other covers found for this book.</p>`; return; }
    box.innerHTML = `<div class="label">Tap the edition you own</div><div class="cover-pick">${eds.map((e, i) => `<button data-act="pickedition" data-i="${i}" class="${e.cover_url === draft.cover_url ? 'on' : ''}" title="${esc(e.label)}">${coverHTML({ title: e.label || draft.title, type: 'book', cover_url: e.cover_url }, true)}</button>`).join('')}</div>`;
    box._eds = eds;
  } catch (e) { box.innerHTML = `<p class="err">Couldn’t load editions right now.</p>`; }
}
function saveItem() {
  const d = draft;
  d.title = (d.title || '').trim();
  if (!d.title) { $('#form-err').textContent = 'Give it a title first.'; return; }
  ['total_pages', 'current_page'].forEach(k => d[k] = d[k] === '' ? '' : Math.max(0, Math.round(num(d[k]))));
  ['total_hours', 'hours_played'].forEach(k => d[k] = d[k] === '' ? '' : Math.max(0, num(d[k])));
  d.updated_at = new Date().toISOString();
  const isNew = d._new; delete d._new;
  if (isNew) {
    if (d.status === 'active') d.date_started = today();
    if (d.status === 'finished') { d.date_finished = today(); if (d.type === 'book' && d.total_pages) d.current_page = d.total_pages; }
    S.items.push(d);
  } else { const i = S.items.findIndex(x => x.id === d.id); S.items[i] = d; }
  const id = d.id; closeModal();
  commit();
  if (isNew) { toast(`<b>Added to your shelf</b><span class="small muted">${esc(d.title)}</span>`); go('item-' + id); }
}

/* ---------- item mutations ---------- */
function touch(it) { it.updated_at = new Date().toISOString(); }
function logProgress(it, unit, amount) { if (amount) S.logs.push({ id: uid(), user_id: USER_ID, itemId: it.id, date: today(), unit, amount }); }
function setPage(it, v) {
  v = Math.max(0, Math.round(num(v))); if (it.total_pages) v = Math.min(v, it.total_pages);
  logProgress(it, 'pages', v - (it.current_page || 0)); it.current_page = v;
  if (it.status === 'want') { it.status = 'active'; it.date_started = it.date_started || today(); }
  if (it.total_pages && v >= it.total_pages && it.status !== 'finished') { setStatus(it, 'finished', true); toast(`<b>Finished!</b><span class="small muted">${esc(it.title)} · +100 XP · the review is unlocked</span>`); }
  touch(it);
}
function setHours(it, v) {
  v = Math.max(0, Math.round(num(v) * 10) / 10);
  logProgress(it, 'hours', v - (it.hours_played || 0)); it.hours_played = v;
  if (it.status === 'want') { it.status = 'active'; it.date_started = it.date_started || today(); }
  touch(it);
}
function setStatus(it, s, silent) {
  const prev = it.status; if (prev === s) return; it.status = s;
  if (s === 'active' && !it.date_started) it.date_started = today();
  if (s === 'finished') { it.date_finished = today(); if (!it.date_started) it.date_started = today();
    if (it.type === 'book' && it.total_pages && (it.current_page || 0) < it.total_pages) { logProgress(it, 'pages', it.total_pages - (it.current_page || 0)); it.current_page = it.total_pages; } }
  if (prev === 'finished' && s !== 'finished') it.date_finished = '';
  touch(it);
  if (!silent && s === 'finished') toast(`<b>${it.type === 'book' ? 'Book finished' : 'Game completed'}!</b><span class="small muted">+100 XP · +5 acorns · the review is unlocked</span>`);
}

/* ---------- backup ---------- */
async function exportBackup() {
  const json = JSON.stringify(S, null, 1), name = `hollow-shelf-backup-${today()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Hollow Shelf backup' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result); if (!data || !Array.isArray(data.items)) throw new Error('bad');
      askConfirm(`Replace everything on this device with the backup (${data.items.length} items)?`, () => { S = normalize(data); commit(); toast('<b>Backup restored</b>'); }, 'Restore', false);
    } catch (e) { toast('<b>That file isn’t a Hollow Shelf backup</b>'); }
  };
  r.readAsText(file);
}

  pick: d => pickResult(lastResults[+d.i]),
  google: async d => { const box = $('#results'); box.innerHTML = '<p class="note">Asking Google Books…</p>'; try { lastResults = await searchGoogle(d.q); } catch (e) { lastResults = []; }
    box.innerHTML = lastResults.length ? `<div class="results">${lastResults.map((r, i) => `<button class="result" data-act="pick" data-i="${i}">${coverHTML({ ...r, type: 'book' }, true)}<div><b>${esc(r.title)}</b><span class="small muted">${esc(r.author)}${r.year ? ' · ' + r.year : ''}${r.total_pages ? ' · ' + r.total_pages + ' p' : ''}</span></div></button>`).join('')}</div>` : '<p class="note">Nothing there either — fill it in by hand.</p>'; },
  editions: () => showEditions(),
  pickedition: (d, el) => { const e = $('#editions')._eds[+d.i]; draft.cover_url = e.cover_url; draft.cover_fallbacks = []; if (e.total_pages) draft.total_pages = e.total_pages; if (e.isbn) draft.isbn = e.isbn;
    document.querySelectorAll('.cover-pick button').forEach(b => b.classList.toggle('on', b === el)); refreshFormCover(); const tp = $('input[data-k="total_pages"]'); if (tp) tp.value = draft.total_pages; },
  upload: () => $('#file-cover').click(),
  nocover: () => { draft.cover_url = ''; draft.cover_fallbacks = []; rerenderForm(); },
  saveitem: () => saveItem(),
  rate: d => { const it = byId(d.id); it.rating = it.rating === +d.n ? 0 : +d.n; touch(it); commit(); },
  status: d => { const it = byId(d.id); setStatus(it, d.s); commit(); },
  start: d => { const it = byId(d.id); setStatus(it, 'active'); commit(); toast(`<b>${it.type === 'book' ? 'Happy reading' : 'Have fun'}!</b><span class="small muted">${esc(it.title)} moved to ${LABEL[it.type].active}</span>`); },
  bump: d => { const it = byId(d.id); if (it.type === 'book') setPage(it, (it.current_page || 0) + +d.n); else setHours(it, (it.hours_played || 0) + +d.n); commit(); },
  del: d => { const it = byId(d.id); askConfirm(`Delete “${esc(it.title)}”? Its progress history goes too.`, () => {
      S.items = S.items.filter(x => x.id !== d.id); S.logs = S.logs.filter(l => l.itemId !== d.id);
      S.collections.forEach(c => c.itemIds = c.itemIds.filter(x => x !== d.id)); S.journal.forEach(j => { if (j.itemId === d.id) j.itemId = ''; });

  newcoll: d => collForm(null, d.id),
  editcoll: d => collForm(S.collections.find(c => c.id === d.c)),
  delcoll: d => askConfirm('Delete this collection? The books and games stay on your shelf.', () => { S.collections = S.collections.filter(c => c.id !== d.c); save(); go('collections'); }, 'Delete'),
  collitems: d => collItemsForm(S.collections.find(c => c.id === d.c)),
  togglecoll: d => { const c = S.collections.find(x => x.id === d.c); c.itemIds = c.itemIds.includes(d.id) ? c.itemIds.filter(x => x !== d.id) : [...c.itemIds, d.id]; commit(); },
  newentry: () => entryForm(), journalfor: d => entryForm(null, d.id),
  editentry: d => entryForm(S.journal.find(j => j.id === d.e)),
  export: () => exportBackup(), import: () => $('#file-import').click(),
  wipe: () => askConfirm('Erase every book, game, journal entry and collection on this device? Save a backup first if you might want them back.', () => { S = blank(); commit(); go('home'); }, 'Erase all')
};
document.addEventListener('click', ev => {
  if (ev.target.closest('#fab')) return A.fab();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closebg') { if (ev.target === el) closeModal(); return; }
  const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') return;
  ev.preventDefault(); f(el.dataset, el, ev);
});
document.addEventListener('submit', ev => { const f = ev.target.closest('[data-submit="search"]'); if (!f) return; ev.preventDefault(); const q = $('#q').value; $('#q').blur(); doSearch(q); });
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.input; if (!k) return;
  if (k === 'f' && draft) { draft[el.dataset.k] = el.value; if (el.dataset.k === 'title') refreshFormCover(); }
  else if (k === 'coverurl' && draft) { draft.cover_url = el.value.trim(); draft.cover_fallbacks = []; refreshFormCover(); }
  else if (k === 'steam' && draft) { draft.steam_appid = el.value.trim(); const id = parseAppId(el.value);
    if (id) { draft.steam_appid = id; const c = steamCovers(id); draft.cover_url = c[0]; draft.cover_fallbacks = c.slice(1); draft.platform = 'Steam'; refreshFormCover(); const sel = $('select[data-change="fplat"]'); if (sel) sel.value = 'Steam'; } }
  else if (k === 'shelfq') { const f = ui[el.dataset.type === 'book' ? 'books' : 'games']; f.q = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('input[data-input="shelfq"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }, 220); }
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.change; if (!k) return;
  const it = el.dataset.id ? byId(el.dataset.id) : null;
  switch (k) {
    case 'page': setPage(it, el.value); return commit();
    case 'hours': setHours(it, el.value); return commit();
    case 'total': if (it.type === 'book') it.total_pages = el.value === '' ? '' : Math.max(0, Math.round(num(el.value))); else it.total_hours = el.value === '' ? '' : Math.max(0, num(el.value)); touch(it); return commit();
    case 'date': it[el.dataset.k] = el.value; touch(it); return commit();
    case 'review': it.review = el.value; touch(it); checkAchievements(); save(); renderShell(); return;
    case 'notes': it.notes = el.value; touch(it); save(); return;
    case 'fplat': draft.platform = el.value; return;
    case 'shelfsort': ui[el.dataset.type === 'book' ? 'books' : 'games'].sort = el.value; return render();
    case 'shelfextra': ui[el.dataset.type === 'book' ? 'books' : 'games'][el.dataset.type === 'book' ? 'genre' : 'platform'] = el.value; return render();
    case 'journalfilter': ui.journalItem = el.value; return render();
    case 'statsyear': ui.statsYear = +el.value; return render();
    case 'pname': S.profile.name = el.value.trim(); return commit();
    case 'pgoal': S.profile.yearGoal = Math.max(0, Math.round(num(el.value))); return commit();
  }
});
$('#file-cover').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f || !draft) return;
  try { draft.cover_url = await resizeImage(f); draft.cover_fallbacks = []; rerenderForm(); } catch (e) { toast('<b>Couldn’t use that image</b>'); }
});
$('#file-import').addEventListener('change', ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) importBackup(f); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
window.addEventListener('hashchange', () => { if ($('#modal-root').innerHTML) closeModal(); readRoute(); });

/* ---------- sky ---------- */
(function sky() {
  const s = $('#sky'); const n = window.innerWidth < 700 ? 4 : 7;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'cloud'; c.innerHTML = cloudSVG();
    const w = 70 + Math.random() * 90, dur = 60 + Math.random() * 70;
    c.style.cssText = `top:${4 + Math.random() * 38}%;width:${w}px;animation-duration:${dur}s;animation-delay:${-Math.random() * dur}s;opacity:${.55 + Math.random() * .4}`;
    s.appendChild(c);
  }
})();

/* ---------- boot ---------- */
(async function boot() {
  S = normalize(await loadState());
  readRoute();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
